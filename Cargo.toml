[workspace]
resolver = "3"
members = ["teltonika-core", "teltonika-rest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt", "macros"] }
teltonika-core = { path = "teltonika-core" }